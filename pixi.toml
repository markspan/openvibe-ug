[workspace]
name = "openvibe"
channels = ["openvibe", "conda-forge", "anaconda", "nodefaults"]
platforms = ["linux-64", "win-64"]

[dependencies]
cmake = "3.25.*"
pkg-config = "*"
ninja = "1.10.0.*"
numpy = "*"
eigen = "3.3.8.*"
gtest = "1.17.0.*"
gmock = "1.17.0.*"
lua = "5.4.6.*"
tinyxml2 = "9.0.0.*"
expat = "2.6.4.*"
xerces-c = "3.3.0.*"
python = "3.10.*"
openal-soft = "1.21.1.*"
freealut = "1.1.0.*"
libvorbis = "1.3.7.*"
libogg = "1.3.4.*"
zlib = "1.3.1.*"
vrpn = "7.31.*"
fftw = "3.3.10.*"
itpp = "4.3.1.*"
liblsl = "1.16.*"
nlohmann_json = "3.11.3.*"
doxygen = "1.9.2.*"

[target.linux-64.dependencies]
gcc_linux-64 = "9.4.0.*"
gxx_linux-64 = "9.4.0.*"
make = "*"
qt6-main = "6.8.*"
qt6-charts = "6.8.*"
qt6-graphs = "6.8.*"
boost-cpp = "1.85.*"
libglvnd-devel-cos7-x86_64 = "*"
xorg-x11-proto-devel-cos7-x86_64 = "*"
mesa-libgl-devel-cos7-x86_64 = "*"
mesa-libegl-devel-cos7-x86_64 = "*"
mesa-dri-drivers-cos7-x86_64 = "*"
libx11-devel-cos7-x86_64 = "*"
libxext-devel-cos7-x86_64 = "*"
libxrender-devel-cos7-x86_64 = "*"
libxcb-cos7-x86_64 = "*"
libxau-devel-cos7-x86_64 = "*"
libdrm-devel-cos7-x86_64 = "*"
libxcomposite-devel-cos7-x86_64 = "*"
libxcursor-devel-cos7-x86_64 = "*"
libxi-devel-cos7-x86_64 = "*"
libxrandr-devel-cos7-x86_64 = "*"
pciutils-devel-cos7-x86_64 = "*"
libxscrnsaver-devel-cos7-x86_64 = "*"
libxtst-devel-cos7-x86_64 = "*"
libselinux-devel-cos7-x86_64 = "*"
libxdamage-cos7-x86_64 = "*"
libxdamage-devel-cos7-x86_64 = "*"
libxfixes-cos7-x86_64 = "*"
libxfixes-devel-cos7-x86_64 = "*"
libxxf86vm-cos7-x86_64 = "*"
libice-devel-cos7-x86_64 = "*"
libxt-devel-cos7-x86_64 = "*"
libsm-devel-cos7-x86_64 = "*"
# For code quality
gcovr = "*"
cppcheck = "*"
valgrind = "*"
clang = "*"
clang-tools = "*"
lcov = "*"

[target.win-64.dependencies]
nsis = "3.11"
vs2022_win-64 = "19.44.35207.*"
vs2013_runtime = { version = "*", channel = "anaconda" }
boost-cpp = "1.83.*"
pthreads-win32 = "2.9.1.*"
sdk-brain-products = "*"
sdk-gtec-unicorn = "*"
sdk-eemagine-eego = "*"
sdk-micromed = "*"
sdk-tmsi = "*"

[tasks]
configure = "cmake -G Ninja -S . -B build"
build = { cmd = "ninja -C build", depends-on = ["configure"] }
test = { cmd = "ctest -T Test", cwd = "build", depends-on = ["build"] }
install = { cmd = "cmake --install build", depends-on = ["build"] }
package = { cmd = "cpack -V --config build/CPackConfig.cmake -B build/package", depends-on = ["build"] }

ci-configure = "cmake -G Ninja -S . -B $BUILD_FOLDER"
ci-build = { cmd = "ninja -C $BUILD_FOLDER", depends-on = ["ci-configure"] }
ci-test = { cmd = "cd \"$BUILD_FOLDER\" && ctest -T Test"  } # depends-on = ["ci-build"] but intentionally removed to avoid rerunning configure & build chain.
ci-package = { cmd = "cpack --config \"$BUILD_FOLDER/CPackConfig.cmake\" -B \"$BUILD_FOLDER/package\"" } # depends-on = ["ci-build"] intentionally omitted, as for ci-test.

[target.linux-64.tasks]
ci-configure = 'cmake -G Ninja -S . -B $BUILD_FOLDER -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS_DEBUG=-O0\ -g\ -Wall\ -fPIC\ -fno-inline\ --coverage -DCMAKE_CXX_FLAGS_DEBUG=-O0\ -g\ -Wall\ -fPIC\ -fno-inline\ --coverage -Wno-dev'
ci-build = { cmd = "ninja -C $BUILD_FOLDER -j2", depends-on = ["ci-configure"] }

ci-analyze = { cmd = "cd \"$BUILD_FOLDER\" && analyze-build --status-bugs --plist --analyze-headers -o analyzer_reports --cdb compile_commands.json", depends-on = ["ci-build"] }

[target.win-64.tasks]
test = { cmd = "ctest -T Test -E uoTimeTest", cwd = "build", depends-on = ["build"] }

ci-test = { cmd = "cd \"$BUILD_FOLDER\" && ctest -T Test -E uoTimeTest"  } # depends-on = ["ci-build"] but intentionally removed to avoid rerunning configure & build chain.


[target.win-64.activation.env]
Qt6_DIR = "C:\\Qt\\6.9.3\\msvc2022_64\\lib\\cmake\\"
