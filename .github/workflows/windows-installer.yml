# UG fork: new file, not in upstream OpenViBE. See UG.md, 2.34.
#
# Builds OpenViBE UG on Windows and packages it with CPack: the NSIS installer (.exe) and a ZIP of
# the same tree. The steps are those of the GitLab Windows pipeline (.gitlab/build.yml and
# package.yml): the pixi environment supplies the compiler and every library but Qt, and the pixi
# tasks ci-build and ci-package do the work, so a local `pixi run package` and this workflow build
# the same thing.
#
# Runs:
#   - by hand, from the Actions tab ("Run workflow"), on any branch: the installer is an artifact
#     of the run;
#   - on a pushed version tag such as 4.0.1 or 4.0.1-ug.1: the installer is also attached to a
#     GitHub release named after the tag.
#
# The version comes from `git describe` (CMake/OvVersion.cmake), so the checkout needs the history
# and the tags. A tag must read MAJOR.MINOR.PATCH, optionally followed by -something.

name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write # to create the release on a tag; a manual run only reads

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match Qt6_DIR in pixi.toml ([target.win-64.activation.env]), which pixi sets on activation.
  QT_VERSION: '6.12.0'
  # Qt Graphs needs Quick 3D and the shader tools. Designer's Icon control (OVControls/Icon.qml)
  # imports Qt5Compat.GraphicalEffects: without qt5compat Designer's window does not load, and
  # Designer runs on without one.
  QT_MODULES: qtcharts qtgraphs qtquick3d qtshadertools qt5compat
  # Short paths: OpenViBE's deepest build paths come close to the Windows 260-character limit.
  BUILD_FOLDER: C:\ovb
  PACKAGE_FOLDER: C:\ovp

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Check out, with history and tags for the version
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Qt is not taken from conda-forge on Windows (see pixi.toml); the lab machines use the
      # official build, so the installer does too. Installed to C:\Qt\<version>\msvc2022_64, the
      # path pixi.toml points Qt6_DIR at. Not with install-qt-action: the aqtinstall it runs (3.3)
      # does not read the layout of Qt's repository from Qt 6.11 on. .github/install-qt.py
      # downloads the packages from Qt's repository itself and checks their SHA-256.
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: C:\Qt\${{ env.QT_VERSION }}
          key: qt-${{ env.QT_VERSION }}-msvc2022_64-${{ env.QT_MODULES }}-${{ hashFiles('.github/install-qt.py') }}

      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: python .github/install-qt.py --version ${{ env.QT_VERSION }} --arch msvc2022_64 --dir C:\Qt --modules ${{ env.QT_MODULES }}

      - name: Install the pixi environment
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
          cache: true

      - name: Build
        run: pixi run ci-build
        env:
          CMAKE_PREFIX_PATH: C:\Qt\${{ env.QT_VERSION }}\msvc2022_64

      # ci-package builds the documentation first (the installer's Start Menu links to it), then
      # runs CPack, which writes openvibe-<version>.exe and .zip to PACKAGE_FOLDER.
      - name: Package
        run: pixi run ci-package
        env:
          CMAKE_PREFIX_PATH: C:\Qt\${{ env.QT_VERSION }}\msvc2022_64

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: openvibe-ug-windows
          path: |
            ${{ env.PACKAGE_FOLDER }}\*.exe
            ${{ env.PACKAGE_FOLDER }}\*.zip
          if-no-files-found: error
          retention-days: 30

      # The release's description: the subject of every commit since the previous version tag, which this fork writes as
      # a sentence saying what changed, and a link to the full comparison. GitHub's own generated notes list merged pull
      # requests, and the fork commits to main directly. A release that already has a description keeps it: notes
      # written by hand before the build finishes are not replaced (the release action keeps a description when it is
      # given none).
      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          previous=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "${tag}^" 2>/dev/null || true)
          notes="release-notes.md"  # in the checkout: a relative path means the same to bash and to the release action
          if gh release view "$tag" --json body --jq .body 2>/dev/null | grep -q .; then
            : > "$notes"  # notes written by hand: the release keeps them
          else
            {
              echo "OpenViBE UG ${tag}, Windows installer and ZIP. Uninstall an earlier version first."
              echo
              if [ -n "$previous" ]; then
                echo "## Changes since ${previous}"
                echo
                git log --no-merges --format='- %s (%h)' "${previous}..${tag}"
                echo
                echo "**Full list of changes:** [${previous}...${tag}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${tag})"
              else
                echo "## Changes"
                echo
                git log --no-merges --format='- %s (%h)' -n 50 "${tag}"
              fi
              echo
              echo "UG.md, at the top of the repository, describes every difference from upstream OpenViBE."
            } > "$notes"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PACKAGE_FOLDER }}\*.exe
            ${{ env.PACKAGE_FOLDER }}\*.zip
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
