---

test-extras_macos:
  stage: test
  needs: [build_openvibe_macosx]
  variables:
    GIT_STRATEGY: none
  tags:
    - macos
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never
  script:
   - conda activate openvibe
   - cd $BUILD_FOLDER/extras;
   - echo "==== Testing Extras ===="
   - ctest -j2 -V --rerun-failed --output-on-failure --output-junit test-extras.xml
  artifacts:
    when: always
    reports:
      junit: $BUILD_FOLDER/extras/test-extras.xml
  allow_failure: true # To be removed when Qt6 porting is done

test-extras_linux:
  stage: test
  needs: [build_openvibe_linux]
  tags:
    - linux
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never
  variables:
    GIT_STRATEGY: none
    DISPLAY: ":0"
  cache:
    key: "${SYSTEM}-$CI_COMMIT_REF_SLUG"
    policy: pull
  script:
    - conda activate openvibe
    - cd $BUILD_FOLDER/extras;
    - echo "==== Testing Extras ===="
    - ctest -j2 --rerun-failed --output-on-failure --output-junit test-extras.xml
  artifacts:
    when: always
    reports:
      junit: $BUILD_FOLDER/extras/test-extras.xml
  allow_failure: true # To be removed when Qt6 porting is done

test-extras_windows:
  stage: test
  needs: [build_openvibe_windows]
  variables:
    GIT_STRATEGY: none
  tags:
    - windows
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never
  script:
    - . C:\Users\ci\miniconda3\shell\condabin\conda-hook.ps1
    - conda activate openvibe
    - $env:PYTHONHOME=$env:CONDA_PREFIX
    - cd $BUILD_FOLDER/extras;
    - echo "==== Testing Extras ===="
    - ctest -j2 -V --rerun-failed --output-on-failure --output-junit test-extras.xml
  artifacts:
    when: always
    reports:
      junit: $BUILD_FOLDER/extras/test-extras.xml
  allow_failure: true # To be removed when Qt6 porting is done
      
test-sdk_macosx:
  stage: test
  needs: [build_openvibe_macosx]
  tags:
    - macos
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never
  variables:
    GIT_STRATEGY: none
  script:
    - conda activate openvibe
    - echo "==== Testing SDK ===="
    - cd $BUILD_FOLDER/sdk/unit-test;
    - ctest -j2 -V -E uoTimeTest --rerun-failed --output-on-failure --output-junit test-sdk_unit.xml
    - cd ../validation-test;
    - ctest -j2 -V --rerun-failed --output-on-failure --output-junit test-sdk_validation.xml
  artifacts:
    when: always
    reports:
      junit: $BUILD_FOLDER/sdk/**/test-sdk_*.xml
  allow_failure: true # To be removed when Qt6 porting is done
        
test-sdk_linux:
  stage: test
  needs: [build_openvibe_linux]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never
  tags:
    - linux
  variables:
    GIT_STRATEGY: none
  cache:
    key: "${SYSTEM}-$CI_COMMIT_REF_SLUG"
    policy: pull
  script:
    - conda activate openvibe
    - echo "==== Testing SDK ===="
    - cd $BUILD_FOLDER/sdk/unit-test;
    - ctest -j2 -V  --rerun-failed --output-on-failure --output-junit test-sdk_unit.xml
    - cd ../validation-test;
    - ctest -j2 -V --rerun-failed --output-on-failure --output-junit test-sdk_validation.xml
  artifacts:
    when: always
    reports:
      junit: $BUILD_FOLDER/sdk/**/test-sdk_*.xml
  allow_failure: true # To be removed when Qt6 porting is done
        
test-sdk_windows:
  stage: test
  needs: [build_openvibe_windows]
  tags:
    - windows
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never
  variables:
    GIT_STRATEGY: none
  script:
    - . C:\Users\ci\miniconda3\shell\condabin\conda-hook.ps1
    - conda activate openvibe
    - $env:PYTHONHOME=$env:CONDA_PREFIX
    - echo "==== Testing SDK ===="
    - cd $BUILD_FOLDER/sdk/unit-test;
    - ctest -j2 -V -E uoTimeTest -C Release --rerun-failed --output-on-failure --output-junit test-sdk_unit.xml
    - cd ../validation-test;
    - ctest -j2 -V -C Release --rerun-failed --output-on-failure --output-junit test-sdk_validation.xml
  artifacts:
    when: always
    reports:
      junit: $BUILD_FOLDER/sdk/**/test-sdk_*.xml
  allow_failure: true # To be removed when Qt6 porting is done

