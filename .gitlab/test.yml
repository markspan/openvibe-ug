---
      
test-macosx:
  stage: test
  needs: [build_openvibe_macosx]
  tags:
    - macos
  rules: !reference [.mr_or_web_rules, rules]
  variables:
    GIT_STRATEGY: none
  script:
    - conda activate openvibe
    - echo "==== Running Tests ===="
    - cd $BUILD_FOLDER/;
    - ctest -V -E uoTimeTest --rerun-failed --output-on-failure --output-junit test.xml
  artifacts:
    when: always
    reports:
      junit: $BUILD_FOLDER/test.xml
  allow_failure: true # To be removed when Qt6 porting is done
        
test-linux:
  stage: test
  needs: [build_openvibe_linux]
  rules: !reference [.mr_or_web_rules, rules]
  tags:
    - linux
  variables:
    GIT_STRATEGY: none
  cache:
    key: "${SYSTEM}-$CI_COMMIT_REF_SLUG"
    policy: pull
  script:
    - conda activate openvibe
    - echo "==== Running Tests ===="
    - cd $BUILD_FOLDER/
    - ctest -V  --rerun-failed --output-on-failure --output-junit test.xml
  artifacts:
    when: always
    reports:
      junit: $BUILD_FOLDER/test.xml
  allow_failure: true # To be removed when Qt6 porting is done
        
test-windows:
  stage: test
  needs: [build_openvibe_windows]
  tags:
    - windows
  rules: !reference [.mr_or_web_rules, rules]
  variables:
    GIT_STRATEGY: none
  script:
    - . D:\miniconda3\shell\condabin\conda-hook.ps1
    - conda activate openvibe
    - $env:PYTHONHOME=$env:CONDA_PREFIX
    - echo "==== Running Tests ===="
    - cd $BUILD_FOLDER/
    - ctest -V -E uoTimeTest -C Release --rerun-failed --output-on-failure --output-junit test.xml
  artifacts:
    when: always
    reports:
      junit: $BUILD_FOLDER/test.xml
  allow_failure: true # To be removed when Qt6 porting is done

