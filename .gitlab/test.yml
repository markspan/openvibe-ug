---
      
test-macosx:
  extends: .unix_base
  stage: test
  needs: [build_openvibe_macosx]
  tags:
    - macos
  rules: !reference [.never_rules, rules]
  script:
    - pixi run ci-test -V -E uoTimeTest --rerun-failed --output-on-failure --output-junit test.xml
  artifacts:
    when: always
    reports:
      junit: $BUILD_FOLDER/test.xml
        
test-linux:
  extends: .unix_base
  stage: test
  needs: [build_openvibe_linux]
  rules: !reference [.mr_or_web_rules, rules]
  tags:
    - linux
  cache:
    key: "${SYSTEM}-$CI_COMMIT_REF_SLUG"
    policy: pull
  script:
    - export QT_QPA_PLATFORM=offscreen
    - pixi run ci-test -V  --rerun-failed --output-on-failure --output-junit test.xml
  artifacts:
    when: always
    reports:
      junit: $BUILD_FOLDER/test.xml
        
test-windows:
  extends: .windows_base
  stage: test
  needs: [build_openvibe_windows]
  tags:
    - windows
  rules: !reference [.mr_or_web_rules, rules]
  script:
    - pixi run ci-test -V --rerun-failed --output-on-failure --output-junit test.xml
  artifacts:
    when: always
    reports:
      junit: $BUILD_FOLDER/test.xml
