---

sonarqube:
  stage: analyze
  tags: ['linux']
  needs:
    - job: build_openvibe_linux
      artifacts: true  
  rules:
    - if: ($CI_PIPELINE_SOURCE == "merge_request_event")
      when: always
    - if: ($CI_PIPELINE_SOURCE == "push")
      when: always
  script:
    - source ${CI_PROJECT_DIR}/.gitlab/analysis.sh
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    expire_in: 24h
    paths:
      - sonar.log
      - sonar-project.properties
      - coverage.xml
      - $BUILD_FOLDER/compile_commands.json
      - $BUILD_FOLDER/analyzer_reports
      - $BUILD_FOLDER/build.log
      - meta-build-linux.log
#    reports:
#      junit: test.xml
#      coverage_report:
#        coverage_format: cobertura
#        path: coverage.xml
    when: always
  allow_failure: true

