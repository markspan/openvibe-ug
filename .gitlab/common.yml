#
# This file describes the common rules for the stages
#
---
variables:
  PULL_REQUEST_BRANCH_NAME: ""

  # GitLab does the clone/clean/fetch for every job, so no job manages the
  # working directory itself. Jobs should not set GIT_STRATEGY; the one
  # deliberate exception is gito-ai-review, which needs full history.
  GIT_STRATEGY: fetch
  GIT_DEPTH: "1"

  # `fetch` runs `git clean` before each job. `-e` is still honoured under `-x`,
  # so ignored files are cleaned except for these two, which must survive:
  #   build-*  $BUILD_FOLDER lives inside $CI_PROJECT_DIR and carries the build
  #            tree from build/ to test/ and sonarqube/. Ageing these out is
  #            cleanup.yml's job, not git's.
  #   .pixi    the resolved pixi environment. Only build/ runs `pixi install`;
  #            without this, every other job would re-resolve Qt, boost and the
  #            MSVC toolchain from scratch.
  GIT_CLEAN_FLAGS: "-ffdx -e build-* -e .pixi"

workflow:
  rules:
    # Pipeline MR
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        PULL_REQUEST_BRANCH_NAME: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        BUILD_FOLDER: "$CI_PROJECT_DIR/build-$CI_MERGE_REQUEST_ID-mr"
      when: always

    # Pipeline after merge
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_MERGE_REQUEST_IID == null && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        PULL_REQUEST_BRANCH_NAME: "$CI_COMMIT_BRANCH"
        BUILD_FOLDER: "$CI_PROJECT_DIR/build-$CI_COMMIT_SHORT_SHA-push"
      when: always

    # Pipeline manually triggered from the GitLab UI ("Run pipeline")
    - if: '$CI_PIPELINE_SOURCE == "web"'
      variables:
        PULL_REQUEST_BRANCH_NAME: "$CI_COMMIT_BRANCH"
        BUILD_FOLDER: "$CI_PROJECT_DIR/build-$CI_COMMIT_SHORT_SHA-web"
      when: always

    - if: '$CI_PIPELINE_SOURCE == "trigger"'
      variables:
        PULL_REQUEST_BRANCH_NAME: "$CI_COMMIT_BRANCH"
        BUILD_FOLDER: "$CI_PROJECT_DIR/build-$CI_COMMIT_SHORT_SHA-trigger"
      when: always

    - when: never

# Shared rule set for jobs that should run on MR pipelines and on manual
# "Run pipeline" (web) triggers. Reused across files with `!reference`, since
# plain YAML anchors don't resolve across separately-included CI files.
.mr_or_web_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never

# Used to temporarily disable a job/stage (e.g. macOS while it's unavailable),
# without deleting its definition. Reference from a job's `rules:` to switch it off.
.never_rules:
  rules:
    - when: never
