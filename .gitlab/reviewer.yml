---

gito-ai-review:
  stage: cleanup
  tags: ['llm']
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web" && $MR_NUMBER  # Manual trigger via "Run pipeline"
      when: manual
  variables:
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - eval "$(micromamba shell hook --shell bash)"
    - SOURCE_BRANCH=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    - echo "target branch $CI_MERGE_REQUEST_TARGET_BRANCH_NAME source branch name $SOURCE_BRANCH"
    - |
        git submodule foreach '
        echo "=== Submodule $name ==="
        # 1 fetch everything from the remote of this sub‑module
        git fetch origin
      
        # 2  does the remote‑tracking ref refs/remotes/origin/$SOURCE_BRANCH exist?
        if git rev-parse --verify --quiet refs/remotes/origin/$SOURCE_BRANCH; then
          echo "✔️  Branch $SOURCE_BRANCH found - checking out"
          git checkout --detach remotes/origin/$SOURCE_BRANCH
        else
          # branch not present – no error, just a friendly note
          echo "  Branch $SOURCE_BRANCH not found in submodule $name, leaving as-is"
        fi
        '
    # gito launch!
    - micromamba activate
    - gito --verbose review --against="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - gito gitlab-comment --project-id $CI_PROJECT_ID --merge-request-iid $CI_MERGE_REQUEST_IID
