---

gito-ai-review:
  stage: cleanup
  tags: ['llm']
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web" && $MR_NUMBER  # Manual trigger via "Run pipeline"
      when: manual
  variables:
    # Deliberate override of the global `fetch` / GIT_DEPTH 1:
    # `gito review --against=origin/<target>` needs real history to diff.
    GIT_DEPTH: 0
    GIT_STRATEGY: clone
  script:
    - eval "$(micromamba shell hook --shell bash)"
    - SOURCE_BRANCH=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    - echo "target branch $CI_MERGE_REQUEST_TARGET_BRANCH_NAME source branch name $SOURCE_BRANCH"
    # gito launch!
    - micromamba activate
    - gito --verbose review --against="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - gito gitlab-comment --project-id $CI_PROJECT_ID --merge-request-iid $CI_MERGE_REQUEST_IID
