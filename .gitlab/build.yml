---

.build_script_linux_template: &build_script_linux
  stage: build
  tags: ['linux']
  needs: ['cleanup_linux']
  script:
    - set -o pipefail
    - source .gitlab/build.sh | tee ${LOGNAME}.log
  artifacts:
    paths:
      - $BUILD_FOLDER/compile_commands.json
      - $BUILD_FOLDER/analyzer_reports
      - $BUILD_FOLDER/build.log
    expire_in: 24h
    when: always
  cache:
    key: "${SYSTEM}-$CI_COMMIT_REF_SLUG"
    untracked: true
    policy: push

build_openvibe_linux:
  <<: *build_script_linux
  variables:
    SYSTEM: linux
    LOGNAME: "${CI_PROJECT_NAME}-build-${SYSTEM}"

.build_script_macosx_template: &build_script_macosx
  stage: build
  tags: ['macos','sonoma']
  needs: [cleanup_mac]
  script:
    - source .gitlab/build.sh | tee ${LOGNAME}.log
  artifacts:
    expire_in: 24h
    when: always
    paths:
      - $BUILD_FOLDER/compile_commands.json
      - $BUILD_FOLDER/build.log
      - $BUILD_FOLDER/analyzer_reports

build_openvibe_macosx:
  <<: *build_script_macosx
  rules: !reference [.never_rules, rules]
  variables:
    SYSTEM: macosx
    LOGNAME: "${CI_PROJECT_NAME}-build-${SYSTEM}"

.build_script_windows_template: &build_script_windows
  stage: build
  tags: ['windows']
  needs: [cleanup_windows]
  script:
    - pixi install
    - pixi run ci-build
  artifacts:
    paths:
      - $BUILD_FOLDER/compile_commands.json
    expire_in: 24h
    when: always
  cache:
    key: "${SYSTEM}-$CI_COMMIT_REF_SLUG"
    untracked: true
    policy: push

build_openvibe_windows:
  <<: *build_script_windows
  rules: !reference [.mr_or_web_rules, rules]
  variables:
    SYSTEM: windows
    CHERE_INVOKING: "yes"
    MSYSTEM: UCRT64
    LOGNAME: "${CI_PROJECT_NAME}-build-${SYSTEM}"
