---

.build_script_linux_template: &build_script_linux
  stage: build
  tags: ['linux']
  needs: ['update_repo_linux']
  script:
    - set -o pipefail
    - source .gitlab/build.sh | tee ${LOGNAME}.log
  artifacts:
    paths:
      - $BUILD_FOLDER/compile_commands.json
      - $BUILD_FOLDER/analyzer_reports
      - $BUILD_FOLDER/build.log
    expire_in: 24h
    when: always
  cache:
    key: "${SYSTEM}-$CI_COMMIT_REF_SLUG"
    untracked: true
    policy: push

build_openvibe_linux:
  <<: *build_script_linux
  variables:
    SYSTEM: linux
    LOGNAME: "${CI_PROJECT_NAME}-build-${SYSTEM}"
    GIT_STRATEGY: none

.build_script_macosx_template: &build_script_macosx
  stage: build
  tags: ['macos','sonoma']
  needs: [update_repo_macosx]
  script:
    - source .gitlab/build.sh | tee ${LOGNAME}.log
  artifacts:
    expire_in: 24h
    when: always
    paths:
      - $BUILD_FOLDER/compile_commands.json
      - $BUILD_FOLDER/build.log
      - $BUILD_FOLDER/analyzer_reports

build_openvibe_macosx:
  <<: *build_script_macosx
  variables:
    SYSTEM: macosx
    LOGNAME: "${CI_PROJECT_NAME}-build-${SYSTEM}"
    GIT_STRATEGY: none

.build_script_windows_template: &build_script_windows
  stage: build
  tags: ['windows']
  needs: [update_repo_windows]
  script:
    # Failed first time :
    # DirectoryNotACondaEnvironmentError: The target directory exists, but it is not a conda environment.
    #    - conda env remove -n openvibe
    - (Remove-Item  "C:\Users\ci\miniconda3\envs\openvibe" -ErrorAction Ignore -Recurse)
    - conda env create -f conda/env_windows.yaml -v
    - conda activate openvibe
    - (Remove-Item  "$BUILD_FOLDER" -ErrorAction Ignore -Recurse)
    - mkdir $BUILD_FOLDER
    - cd $BUILD_FOLDER
    
    # Setup MSVC
    - $vsPath = &"${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationpath
    - Import-Module (Get-ChildItem $vsPath -Recurse -File -Filter Microsoft.VisualStudio.DevShell.dll).FullName
    - Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64'

    # Setup Qt
    - $env:Qt6_DIR = "C:\Qt\6.6.3\msvc2019_64\lib\cmake\"

    # Build
    - cmake .. -G Ninja #                            OpenVibe
    - ninja -j1
  artifacts:
    paths:
      - $BUILD_FOLDER/compile_commands.json
    expire_in: 24h
    when: always
  cache:
    key: "${SYSTEM}-$CI_COMMIT_REF_SLUG"
    untracked: true
    policy: push

build_openvibe_windows:
  <<: *build_script_windows
  variables:
    SYSTEM: windows
    CHERE_INVOKING: "yes"
    MSYSTEM: UCRT64
    LOGNAME: "${CI_PROJECT_NAME}-build-${SYSTEM}"
    GIT_STRATEGY: none
