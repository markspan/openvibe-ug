---

.build_script_linux_template: &build_script_linux
  stage: build
  tags: ['linux']
  needs: ['cleanup_linux']
  script:
    - set -o pipefail
    - source .gitlab/build.sh | tee ${LOGNAME}.log
  artifacts:
    paths:
      - $BUILD_FOLDER/compile_commands.json
      - $BUILD_FOLDER/analyzer_reports
      - $BUILD_FOLDER/build.log
    expire_in: 24h
    when: always
  cache:
    key: "${SYSTEM}-$CI_COMMIT_REF_SLUG"
    untracked: true
    policy: push

build_openvibe_linux:
  <<: *build_script_linux
  extends: .unix_base # Similar to <<:, but this template lives in another file, and <<: don't support this.
  variables:
    SYSTEM: linux
    LOGNAME: "${CI_PROJECT_NAME}-build-${SYSTEM}"

.build_script_macosx_template: &build_script_macosx
  stage: build
  tags: ['macos','sonoma']
  needs: [cleanup_mac]
  script:
    - source .gitlab/build.sh | tee ${LOGNAME}.log
  artifacts:
    expire_in: 24h
    when: always
    paths:
      - $BUILD_FOLDER/compile_commands.json
      - $BUILD_FOLDER/build.log
      - $BUILD_FOLDER/analyzer_reports

build_openvibe_macosx:
  <<: *build_script_macosx
  extends: .unix_base # Similar to <<:, but this template lives in another file, and <<: don't support this.
  rules: !reference [.never_rules, rules]
  variables:
    SYSTEM: macosx
    LOGNAME: "${CI_PROJECT_NAME}-build-${SYSTEM}"

.build_script_windows_template: &build_script_windows
  stage: build
  tags: ['windows']
  needs: [cleanup_windows]
  script:
    - pixi install
    - pixi run ci-build
  artifacts:
    paths:
      - $BUILD_FOLDER/compile_commands.json
    expire_in: 24h
    when: always
  # No cache: test-windows reuses $BUILD_FOLDER and .pixi directly from the
  # runner's working tree (kept alive by GIT_CLEAN_FLAGS). Adding cache then takes
  # ages to generate and times out the stage.

build_openvibe_windows:
  <<: *build_script_windows
  extends: .windows_base # Similar to <<:, but this template lives in another file, and <<: don't support this.
  # Also on tags: the package stage consumes this job's build tree.
  rules: !reference [.mr_web_or_tag_rules, rules]
  variables:
    SYSTEM: windows
    CHERE_INVOKING: "yes"
    MSYSTEM: UCRT64
    LOGNAME: "${CI_PROJECT_NAME}-build-${SYSTEM}"
