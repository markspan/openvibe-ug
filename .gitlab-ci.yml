---

variables:
  PULL_REQUEST_BRANCH_NAME: ""
  
workflow:
  rules:
    # Pipeline MR
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PULL_REQUEST_BRANCH_NAME: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        BUILD_FOLDER: "$CI_PROJECT_DIR/build-$CI_MERGE_REQUEST_ID"
      when: always

    # Pipeline after merge
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_MERGE_REQUEST_ID == ""'
      variables:
        PULL_REQUEST_BRANCH_NAME: "$CI_COMMIT_BRANCH"
        BUILD_FOLDER: "$CI_PROJECT_DIR/build-$CI_COMMIT_SHA"
      when: always

    - when: never

stages:
  - cleanup
  - git_update
  - build
  - analyze
  - test

include:
  - .gitlab/common.yml
  - .gitlab/update_from_meta.yml
  - .gitlab/build.yml
  - .gitlab/test.yml
  - .gitlab/analyse.yml
  - .gitlab/cleanup.yml