---

variables:
  PULL_REQUEST_BRANCH_NAME: ""
  
workflow:
  rules:
    # Pipeline MR
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        PULL_REQUEST_BRANCH_NAME: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        BUILD_FOLDER: "$CI_PROJECT_DIR/build-$CI_MERGE_REQUEST_ID"
      when: always

    # Pipeline after merge
    - if: $CI_PIPELINE_SOURCE == "push"
      variables:
        PULL_REQUEST_BRANCH_NAME: "$CI_COMMIT_BRANCH"
        BUILD_FOLDER: "$CI_PROJECT_DIR/build-$CI_COMMIT_SHA"
      when: always

    - when: never

stages:
  - cleanup
  - git_update
  - build
  - analyze
  - test

include:
  - .gitlab/common.yml
  - .gitlab/update_from_meta.yml
  - .gitlab/build.yml
  - .gitlab/test.yml
  - .gitlab/analyse.yml

# Global cleanup at start
.cleanup_env: &cleanup_script
  stage: cleanup
  script:
    - |
      echo "Cleaning all build-* folder which have more than 6h"

      if find "$CI_PROJECT_DIR" -maxdepth 1 -type d -name "build-*" -mmin +360 | grep -q .; then
        find "$CI_PROJECT_DIR" \
          -maxdepth 1 \
          -type d \
          -name "build-*" \
          -mmin +360 \
          -print \
          -exec rm -rf {} \;
      else
        echo "No old build-* folders to clean"
      fi
  rules:
    - when: always

cleanup_linux:
  tags: ['linux']
  <<: *cleanup_script

cleanup_mac:
  tags: ['macos']
  <<: *cleanup_script

cleanup_windows:
  stage: cleanup
  tags:
    - windows
  rules:
    - when: always
  script:
    - |
        powershell -NoProfile -Command "
          `$limit = (Get-Date).AddHours(-6)
          `$root  = `$env:CI_PROJECT_DIR

          Write-Host 'Cleaning all build-* folders older than 6h in' `$root
          Write-Host 'Time limit:' `$limit

          Get-ChildItem `$root -Directory -Filter 'build-*' |
            Where-Object { `$_.LastWriteTime -lt `$limit } |
            ForEach-Object {
              Write-Host 'Removing' `$_.FullName '(last write:' `$_.LastWriteTime ')'
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue `$_.FullName
            }
        "
